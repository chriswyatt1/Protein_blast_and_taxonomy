title: "Protein_blast_and_taxonomy"
subtitle: "Blast hits and their taxonomy"
intro_text: >
  This report summarises a run of the Protein_blast_and_taxonomy pipeline: the database and software used,
  how many sequences found a hit and how similar their top hits are, and the taxonomy of those top hits.
report_comment: >
  Generated by <a href="https://github.com/chriswyatt1/Protein_blast_and_taxonomy">Protein_blast_and_taxonomy</a>.
  The full results are in the Blast_results, Taxo_figure and Taxo_summary folders next to this report.

